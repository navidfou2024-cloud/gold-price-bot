name: Test Telegram Destinations Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Send prices to private chat and Telegram channel 1
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          USER_CHAT_ID: ${{ secrets.USER_CHAT_ID }}
          TELEGRAM_CHANNEL_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_CHAT_ID }}
          TELEGRAM_CHANNEL_2_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_2_CHAT_ID }}
        run: python test_telegram_only.py
