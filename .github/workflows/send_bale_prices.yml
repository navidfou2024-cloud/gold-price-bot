name: Send Gold Prices to Bale

on:
  schedule:
    # Every day at 09:00, 12:00, 15:00, and 18:00 Tehran time
    - cron: '0 9,12,15,18 * * *'
      timezone: 'Asia/Tehran'

  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Send private price message to Bale
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: python bale_bot.py
