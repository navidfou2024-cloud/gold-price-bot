name: Test Bale Destinations Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Send prices to private Bale chat and both channels
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          BALE_CHANNEL_CHAT_ID: ${{ secrets.BALE_CHANNEL_CHAT_ID }}
          BALE_CHANNEL_2_CHAT_ID: ${{ secrets.BALE_CHANNEL_2_CHAT_ID }}
        run: python test_bale_only.py
